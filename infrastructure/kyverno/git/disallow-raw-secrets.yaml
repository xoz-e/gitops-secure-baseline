# CI only. Do not add this file to a Kustomization.
#
# Flux decrypts SOPS before apply, and External Secrets creates Secret
# objects at runtime. An admission rule that rejects every Secret would
# block both. `kyverno test` runs this against Git, where a SOPS file still
# has sops.mac and a raw Secret does not.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-raw-secrets
  annotations:
    gitops.shafie.dev/install: "false"
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: false
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  validations:
    - expression: "has(object.sops) && has(object.sops.mac) && string(object.sops.mac) != ''"
      message: >-
        Do not commit a raw Secret. Encrypt the manifest with SOPS (Flux can
        decrypt it: https://fluxcd.io/flux/guides/mozilla-sops/) or stop
        committing the Secret and create it with External Secrets
        (https://external-secrets.io/). A SOPS file has a sops.mac entry; a
        raw Secret does not.
