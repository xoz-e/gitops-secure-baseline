# Privileged containers share the host's devices and can leave the pod.
# Workload namespaces only. kube-system, kyverno, and flux-system run
# components this rule is not written for. Do not add an application
# namespace to the exclusion; add a PolicyException.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  matchConditions:
    - name: exclude-system-namespaces
      expression: >-
        !(object.metadata.?namespace.orValue('') in ['kube-system', 'kyverno', 'flux-system'])
  variables:
    - name: podSpec
      expression: >-
        object.spec.?jobTemplate.?spec.?template.?spec.orValue(
          object.spec.?template.?spec.orValue(object.spec))
    - name: containers
      expression: >-
        variables.podSpec.containers
        + variables.podSpec.?initContainers.orValue([])
        + variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?privileged.orValue(false) == false)
      message: >-
        Privileged containers are not allowed. Unset securityContext.privileged,
        or set it to false.
