# Fixture for the CLI. The mac is not real ciphertext, and this file is
# not applied. The policy only checks that sops.mac is present.
apiVersion: v1
kind: Secret
metadata:
  name: good-sops
  namespace: demo
type: Opaque
stringData:
  token: ENC[AES256_GCM,data:not-real,iv:not-real,tag:not-real,type:str]
sops:
  mac: ENC[AES256_GCM,data:not-real,iv:not-real,tag:not-real,type:str]
